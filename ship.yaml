# How this repo deploys. Read by ideaSquared/shipper's reusable workflow (see its README).
product: gaminginit-bot
# ideaSquared bot project: the deploy message goes to its gaminginit-github channel.
discord: gaminginit
checks: [test]
# `ship deploy gaminginit-bot` starts this workflow (it runs the tests, then deploys main).
dispatch:
  workflow: ci.yml
environments:
  production: {}
components:
  bot:
    type: cloudflare-worker
    # Polled after each deploy; if it never answers, the Worker is rolled back to the previous version.
    health: /api/stats
