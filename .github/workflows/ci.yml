name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on main go one at a time, in the order they were pushed, so an older commit never deploys after a newer one.
# A run waiting its turn is dropped when a newer one arrives. Pull requests each run on their own.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # Builds the Worker as a deploy does, without deploying it.
      - run: pnpm exec wrangler deploy --dry-run

  # Deploys main to Cloudflare once the tests pass. See "Deploy from GitHub" in the README.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README, Deploy from GitHub)."
            exit 0
          fi
          pnpm run deploy
